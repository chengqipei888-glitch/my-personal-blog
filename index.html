<h2>关于我，以及这个博客</h2>
<p>我叫裴成启。</p>
<p>建立这个博客，是想给自己留一个安静的角落。</p>
<p>这里不需要刻意展示什么，也不需要迎合谁。</p>
<p>我想记录一些生活中的感受、学习中的思考，以及那些值得记住的瞬间。</p>
<p>有些想法可能很普通，有些文字也许并不成熟，但我希望它们都能被认真地留下来。</p>
<p><strong>写给未来的自己，也写给偶然来到这里的人。</strong></p>
